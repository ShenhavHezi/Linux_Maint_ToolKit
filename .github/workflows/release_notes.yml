name: Draft Release Notes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Release Notes Body
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/release_notes/release_notes_${tag}.md"
          if [[ -f "$notes_file" ]]; then
            cp "$notes_file" release_notes.md
            exit 0
          fi

          python3 - <<'PY' > release_notes.md
          import re
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"^## Unreleased\s*(.*?)^## ", text, flags=re.S | re.M)
          if not m:
              body = "(No Unreleased notes found.)"
          else:
              body = m.group(1).strip()
              if not body or body == "- (add changes here)":
                  body = "(No Unreleased notes found.)"
          print(body)
          PY

      - name: Check Existing Release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json isDraft > release_meta.json 2>/dev/null; then
            if jq -e '.isDraft == false' release_meta.json >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip Existing Published Release
        if: steps.existing_release.outputs.skip == 'true'
        run: echo "Published release already exists for ${GITHUB_REF_NAME}; skipping draft update."

      - name: Create Draft Release
        if: steps.existing_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
