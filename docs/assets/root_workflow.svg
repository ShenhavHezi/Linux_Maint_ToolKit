<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">linux-maint operator workflow</title>
  <desc id="desc">A compact flow showing Check, Run, Triage, Repair, and Share with supporting outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 14px Arial, sans-serif; fill: #475569; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 13px Arial, sans-serif; fill: #334155; }
      .mini { font: 700 12px Arial, sans-serif; fill: #7c2d12; }
      .chip { font: 700 11px Arial, sans-serif; fill: #14532d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="24" fill="url(#bg)"/>
  <text x="52" y="44" class="title">How linux-maint works in practice</text>
  <text x="52" y="68" class="sub">Start with readiness, run collection, triage quickly, then repair and share artifacts when needed.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="104" width="180" height="108" rx="18" fill="#ffffff"/>
    <rect x="64" y="122" width="54" height="22" rx="11" fill="#dbeafe"/>
    <text x="75" y="137" class="mini">Step 1</text>
    <text x="64" y="166" class="boxTitle">Check</text>
    <text x="64" y="188" class="boxText">Validate config, paths,</text>
    <text x="64" y="206" class="boxText">and readiness first.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="266" y="104" width="180" height="108" rx="18" fill="#ffffff"/>
    <rect x="282" y="122" width="54" height="22" rx="11" fill="#dcfce7"/>
    <text x="293" y="137" class="mini">Step 2</text>
    <text x="282" y="166" class="boxTitle">Run</text>
    <text x="282" y="188" class="boxText">Collect health, status,</text>
    <text x="282" y="206" class="boxText">and summary artifacts.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="484" y="104" width="180" height="108" rx="18" fill="#ffffff"/>
    <rect x="500" y="122" width="54" height="22" rx="11" fill="#fef3c7"/>
    <text x="511" y="137" class="mini">Step 3</text>
    <text x="500" y="166" class="boxTitle">Triage</text>
    <text x="500" y="188" class="boxText">Use menu, status, report,</text>
    <text x="500" y="206" class="boxText">diff, and history.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="702" y="104" width="180" height="108" rx="18" fill="#ffffff"/>
    <rect x="718" y="122" width="54" height="22" rx="11" fill="#fee2e2"/>
    <text x="729" y="137" class="mini">Step 4</text>
    <text x="718" y="166" class="boxTitle">Repair</text>
    <text x="718" y="188" class="boxText">Use doctor, focused runs,</text>
    <text x="718" y="206" class="boxText">and another check.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="104" width="232" height="108" rx="18" fill="#ffffff"/>
    <rect x="936" y="122" width="54" height="22" rx="11" fill="#e0f2fe"/>
    <text x="947" y="137" class="mini">Step 5</text>
    <text x="936" y="166" class="boxTitle">Share</text>
    <text x="936" y="188" class="boxText">Export JSON, metrics, and</text>
    <text x="936" y="206" class="boxText">support bundles safely.</text>
  </g>

  <g stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M228 158 H252"/>
    <path d="M446 158 H470"/>
    <path d="M664 158 H688"/>
    <path d="M882 158 H906"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="252,158 240,151 240,165"/>
    <polygon points="470,158 458,151 458,165"/>
    <polygon points="688,158 676,151 676,165"/>
    <polygon points="906,158 894,151 894,165"/>
  </g>

  <g>
    <rect x="52" y="226" width="170" height="20" rx="10" fill="#ecfccb"/>
    <text x="77" y="240" class="chip">menu • status • report • pack-logs</text>
    <rect x="236" y="226" width="198" height="20" rx="10" fill="#ede9fe"/>
    <text x="260" y="240" class="chip">repo mode • installed mode • RPM</text>
    <rect x="448" y="226" width="224" height="20" rx="10" fill="#fee2e2"/>
    <text x="473" y="240" class="chip">RHEL 9 • SSH fleet checks • dark-site</text>
  </g>
</svg>
