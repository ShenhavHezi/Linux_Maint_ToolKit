<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">linux-maint repository banner</title>
  <desc id="desc">A banner showing linux-maint as an operations console for Linux health, triage, and maintenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#101b32" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="66" r="120" fill="#1d4ed8" fill-opacity="0.12"/>
  <circle cx="1020" cy="270" r="170" fill="#16a34a" fill-opacity="0.08"/>
  <circle cx="180" cy="280" r="140" fill="#f59e0b" fill-opacity="0.07"/>

  <rect x="52" y="48" width="510" height="224" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.08" filter="url(#shadow)"/>
  <rect x="638" y="36" width="510" height="248" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.08" filter="url(#shadow)"/>

  <text x="82" y="96" fill="#E5EEF9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" letter-spacing="3.2">LINUX MAINTENANCE TOOLKIT</text>
  <text x="82" y="146" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="700">linux-maint</text>
  <text x="82" y="184" fill="#A7B6CA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Health checks, triage, repair, and support artifacts</text>
  <text x="82" y="214" fill="#A7B6CA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">for RHEL 9 fleets, SSH monitoring nodes, and dark-site ops.</text>

  <rect x="82" y="236" width="148" height="24" rx="12" fill="#0f3a2a"/>
  <rect x="242" y="236" width="130" height="24" rx="12" fill="#3f2a06"/>
  <rect x="384" y="236" width="116" height="24" rx="12" fill="#13263f"/>
  <text x="100" y="253" fill="#86EFAC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">OFFLINE FIRST</text>
  <text x="265" y="253" fill="#FCD34D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">ROLLBACK SAFE</text>
  <text x="410" y="253" fill="#93C5FD" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">RPM READY</text>

  <rect x="672" y="62" width="442" height="196" rx="16" fill="#08101d" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <rect x="672" y="62" width="442" height="28" rx="16" fill="#0f1a2e"/>
  <circle cx="694" cy="76" r="5" fill="#ef4444"/>
  <circle cx="712" cy="76" r="5" fill="#f59e0b"/>
  <circle cx="730" cy="76" r="5" fill="#22c55e"/>
  <text x="754" y="81" fill="#8BA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">linux-maint menu</text>

  <text x="694" y="116" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Overview</text>
  <text x="694" y="142" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; status: WARN   top_reason: config_missing</text>
  <text x="694" y="166" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">  run       execute fleet checks</text>
  <text x="694" y="190" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">  triage    investigate and repair</text>
  <text x="694" y="214" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">  share     export bundle and reports</text>
  <text x="694" y="238" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">  verify-release  check tarball + provenance</text>

  <path d="M610 44C645 48 664 78 662 108" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M602 254C640 242 659 221 668 192" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
</svg>
